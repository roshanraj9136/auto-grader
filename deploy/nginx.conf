# Edge proxy for AutoGrader.
limit_req_zone $binary_remote_addr zone=grade_submit:10m rate=6r/m;   # submissions per client IP

upstream autograder_api {
    server api:8000;
    keepalive 16;                     # reuse upstream connections (saves a TCP handshake per request)
}

server {
    listen 80;
    client_max_body_size 256k;        # Dockerfile uploads are capped at 100 KB by the API anyway

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown text/plain;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Job submission: rate limited.
    location ~ ^/api/grade {
        limit_req zone=grade_submit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://autograder_api;
    }

    # Server-Sent Events: no buffering / compression, long-lived.
    location ~ ^/api/jobs/[0-9a-f]+/events$ {
        proxy_pass http://autograder_api;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://autograder_api;
    }
}
