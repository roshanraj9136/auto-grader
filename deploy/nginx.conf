# Edge proxy + load balancer for AutoGrader+.

# Docker's embedded DNS: re-resolve `api` every few seconds, so `docker compose up --scale api=N`
# and recreated containers are picked up without restarting nginx (needs nginx >= 1.27.3).
resolver 127.0.0.11 valid=5s ipv6=off;

# Sticky key: the session cookie, falling back to the API token + client IP for cookie-less clients.
map $cookie_ag_session $lb_key {
    ""      "$http_authorization$remote_addr";
    default $cookie_ag_session;
}

limit_req_zone $lb_key zone=grade_submit:10m rate=6r/m;               # grading submissions per user (or IP)
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;          # login / sign-up attempts per client IP
limit_req_zone $binary_remote_addr zone=lab:10m rate=50r/s;           # lab endpoints (LB lab fires bursts)

# `api` resolves to every replica's IP, so each upstream below balances across all of them.

# Default: sticky. Live grading state + SSE streams live in the memory of the replica that accepted
# the job, so a user's requests keep landing on that replica. (Plain `hash`, not `consistent`:
# ketama keys the ring by server *name*, and all replicas share the name `api`.)
upstream api_sticky {
    zone api_sticky 64k;
    hash $lb_key;
    server api:8000 resolve;
    keepalive 16;                     # reuse upstream connections (saves a TCP handshake per request)
    keepalive_timeout 4s;             # below uvicorn's 5 s idle timeout: never reuse a closing socket
}

upstream api_rr {                     # round-robin (nginx default)
    zone api_rr 64k;
    server api:8000 resolve;
    keepalive 8;
    keepalive_timeout 4s;
}

upstream api_least {                  # fewest active connections wins
    zone api_least 64k;
    least_conn;
    server api:8000 resolve;
    keepalive 8;
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 256k;        # Dockerfile uploads are capped at 100 KB by the API anyway

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json text/markdown text/plain image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # edge proxy: overwrite, never trust client-sent XFF
    proxy_set_header X-Forwarded-Proto $scheme;

    # Grading submissions: rate limited.
    location ~ ^/api/(grade|assignments/[0-9]+/submit) {
        limit_req zone=grade_submit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_sticky;
    }

    # Credential endpoints: slow down password guessing.
    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=auth burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api_sticky;
    }

    # Server-Sent Events: no buffering / compression, long-lived.
    location ~ ^/api/jobs/[0-9a-f]+/events$ {
        proxy_pass http://api_sticky;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location /api/lab/ {
        limit_req zone=lab burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://api_sticky;
    }

    # Load-balancer lab: the same endpoint behind three balancing algorithms.
    # (proxy_set_header in a location replaces the inherited set, so the common headers are repeated.)
    location /lb/rr/ {
        limit_req zone=lab burst=200 nodelay;
        limit_req_status 429;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-LB-Algorithm "round-robin";
        proxy_pass http://api_rr;
    }
    location /lb/least/ {
        limit_req zone=lab burst=200 nodelay;
        limit_req_status 429;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-LB-Algorithm "least-connections";
        proxy_pass http://api_least;
    }
    location /lb/hash/ {
        limit_req zone=lab burst=200 nodelay;
        limit_req_status 429;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-LB-Algorithm "sticky (hash of session cookie)";
        proxy_pass http://api_sticky;
    }

    location / {
        proxy_pass http://api_sticky;
    }
}
