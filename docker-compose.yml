# docker compose up --build   ->  http://localhost:8080
# Static-analysis mode by default. To let AutoGrader build/run student Dockerfiles, also pass
#   -f docker-compose.sandbox.yml   (mounts the Docker socket - read the security note first).
services:
  api:
    build: .
    image: autograder:1.0.0
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTOGRADER_AGENT_MODEL: ${AUTOGRADER_AGENT_MODEL:-claude-sonnet-5-5}
      AUTOGRADER_JUDGE_MODEL: ${AUTOGRADER_JUDGE_MODEL:-claude-sonnet-5-5}
      AUTOGRADER_API_TOKEN: ${AUTOGRADER_API_TOKEN:-}
      AUTOGRADER_ENABLE_DOCKER: "0"
      AUTOGRADER_MAX_CONCURRENT_JOBS: ${AUTOGRADER_MAX_CONCURRENT_JOBS:-2}
    volumes:
      - autograder-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    networks: [backend]

  # Reverse proxy: rate-limits submissions, disables buffering for SSE, gzips reports.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

volumes:
  autograder-data:

networks:
  backend:
